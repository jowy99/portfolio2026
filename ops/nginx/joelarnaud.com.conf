##
## Production vhost (canonical host + HTTPS redirect)
## Domain: joelarnaud.com
##

server {
  listen 80;
  listen [::]:80;
  server_name joelarnaud.com www.joelarnaud.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  return 301 https://joelarnaud.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.joelarnaud.com;

  ssl_certificate /etc/letsencrypt/live/joelarnaud.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/joelarnaud.com/privkey.pem;

  return 301 https://joelarnaud.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name joelarnaud.com;

  ssl_certificate /etc/letsencrypt/live/joelarnaud.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/joelarnaud.com/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  location ~* ^/_astro/ {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|webp|avif|ico|woff2?)$ {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
  }
}
